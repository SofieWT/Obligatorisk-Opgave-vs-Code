<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>
</head>
<body>
    <div id="app">
        <div class="container mt-5">

            <h1>Records</h1>
            <br>
            <div v-if="!loggedIn" class="d-flex gap-2">
                <input v-model="auth.username" id ="username" placeholder="Username" type="text">
                <input v-model="auth.password" id="password" placeholder="Password" type="password">
                <button @click="login" class="btn btn-primary" id="loginButton">Login</button>
                <p v-if="authMessage">{{ authMessage }}</p>
            </div>
            <div v-else>
                <div>
                    <p id="welcomeMessage">{{ authMessage }}</p>
                    <button @click="logout" class="btn btn-danger">Logout</button>
                    <br>
                    <br>
                </div>
                <h2>Get All Records</h2> 
                <button class="btn btn-primary" id="getAllButton" @click="getRecords">Get All Records</button>
                <br>
                <br>
                <table class="table table-striped table-bordered" id="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Artist</th>
                            <th>Duration</th>
                            <th>Publication Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="record in records">
                            <td>{{ record.id }}</td>
                            <td>{{ record.title }}</td>
                            <td>{{ record.artist }}</td>
                            <td>{{ record.durationInSecs }}</td>
                            <td>{{ record.publicationYear }}</td>
                        </tr>
                    </tbody>
                </table>
            
                <div>
                <h2> Filter records</h2>
                <input type="text" v-model="filterCriteria" placeholder="Filter kriterium" class="form-control mb-3" id="filterInput">
                
<!--                 <div class="dropdown" v-model="filterRecords">
                    <button class="btn btn-secondary dropdown-toggle mb-3" type="button" id="dropdownMenuButton" data-toggle="dropdown">
                        Select Filter
                    </button>
                    <ul class="dropdown-menu"  class="mb-3">
                        <li><a class="dropdown-item"  @click="toGetTitle">Title</a></li>
                        <li><a class="dropdown-item" @click="toGetArtist">Artist</a></li>
                        <li><a class="dropdown-item"  @click="toGetDuration">Duration</a></li>
                        <li><a class="dropdown-item"  @click="toGetPublicationYear">Publication Year</a></li>
                    </ul>                    
                </div>
 
                <button class="btn btn-primary" @click="filterRecords(filterCriteria)">Filter Records</button> -->
                <div class="mb-3 d-flex gap-2">
                    <button class="Btn btn-primary" @click="FilterByTitle(filterCriteria)" id="filterByTitleButton">Filter By Title</button>
                    <button class="Btn btn-primary" @click="FilterByArtist(filterCriteria)" id="filterByArtistButton">Filter By Artist</button>
                    <button class="Btn btn-primary" @click="FilterByDuration(filterCriteria)" id="filterByDurationButton">Filter By Duration</button>
                    <button class="Btn btn-primary" @click="FilterByPublicationYear(filterCriteria)" id="filterByPublicationYearButton">Filter By Publication Year</button>
                </div>
                <div v-if="role=='admin'">
                    <h2>Add Record</h2>
                </div>
            </div>  
        </div>
    </div>
    <script src="Index.js"></script>
</body>
</html>
